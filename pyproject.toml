[project]
name = "dailies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samuel", email = "meadss0115@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
dailies = "dailies.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = [
     "E",
     "W",
     "F",
     "I",
     "UP",
     "B",
     "SIM",
     "RUF",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
